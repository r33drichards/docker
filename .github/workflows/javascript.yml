name: JavaScript quick checks
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: javascript-quick-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  quality:
    env:
      PIP_CACHE_DIR: /tmp/quality-pip-cache
    runs-on: ubuntu-22.04
    container: debian:trixie
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install versioned toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git python3 python3-venv clang-format-19 shellcheck cppcheck
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/quality-pip-cache
          key: ruff-trixie-0.16.9
      - name: Formatting, lint, generated files, and workflow lint
        run: |
          python3 -m venv /tmp/quality-venv
          /tmp/quality-venv/bin/pip install --disable-pip-version-check ruff==0.16.9
          export PATH="/tmp/quality-venv/bin:$PATH"
          sh tests/ci/quality.sh
          sh tests/ci/actionlint.sh
  native:
    runs-on: ubuntu-22.04
    container: debian:trixie
    timeout-minutes: 15
    env:
      CXX: g++-14
      CC: gcc-14
      CI_NATIVE_LOG_DIR: artifacts/native
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install distro-matched V8 and native tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends g++-14 libc6-dbg libnode-dev libcurl4-openssl-dev libsqlite3-dev libssl-dev valgrind pkg-config python3 openssl nodejs
          mkdir -p artifacts/native
          dpkg-query -W > artifacts/native/packages.txt
          useradd --create-home --uid 1000 ci
          chown -R ci:ci "$GITHUB_WORKSPACE"
      - name: Required ASan, UBSan, leak and ownership checks
        run: |
          runuser -u ci -- bash tests/js_async_http.sh
          runuser -u ci -- node tests/replay/run.cjs --preload tests/rss_sqlite_mock.js --script examples/rss.js tests/replay/rss.js tests/replay/rss_sqlite.js
          runuser -u ci -- sh tests/js_replay.sh --preload tests/rss_sqlite_mock.js --script examples/rss.js tests/replay/rss.js tests/replay/rss_sqlite.js
          runuser -u ci -- node tests/test_rss.cjs
          python3 tests/test_sqlite_bootstrap.py
          python3 tests/test_persistent_config.py
          runuser -u ci -- python3 tests/test_sqlite_bootstrap.py
          runuser -u ci -- python3 tests/test_persistent_config.py
          runuser -u ci -- sh tests/bounded_log.sh
          runuser -u ci -- env CXXFLAGS="-O1 -fsanitize=address,undefined -fno-sanitize-recover=all" sh tests/bounded_log.sh
          runuser -u ci -- sh tests/js_sqlite.sh
          runuser -u ci -- env CXXFLAGS="-O1 -fsanitize=address,undefined -fno-sanitize-recover=all" sh tests/js_sqlite.sh
          runuser -u ci -- node tests/test_join_webhook.cjs
          runuser -u ci -- node tests/test_wchat_nocodb.cjs
          runuser -u ci -- sh tests/js_async_http.sh
          runuser -u ci -- node tests/replay/run.cjs
          runuser -u ci -- sh tests/js_replay.sh
          runuser -u ci -- python3 tests/test_js_fetch_headers.py
          runuser -u ci -- env WEBHOOK_TEST_CXXFLAGS="-O1 -fsanitize=address,undefined -fno-sanitize-recover=all" python3 tests/test_js_fetch_headers.py
          runuser -u ci -- python3 tests/test_js_webhooks.py
          runuser -u ci -- env WEBHOOK_TEST_CXXFLAGS="-O1 -fsanitize=address,undefined -fno-sanitize-recover=all" python3 tests/test_js_webhooks.py
          runuser -u ci -- bash tests/ci/native.sh sanitizers
          runuser -u ci -- bash tests/ci/native.sh valgrind
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-${{ github.sha }}
          path: artifacts/native
          if-no-files-found: error
          retention-days: 14
  fuzz-smoke:
    runs-on: ubuntu-22.04
    container: debian:trixie
    timeout-minutes: 10
    env:
      CXX: clang++-19
      FUZZ_OUT: artifacts/fuzz
      FUZZ_SECONDS: '10'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install fuzzer toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang-19 libclang-rt-19-dev g++-14 python3
          useradd --create-home --uid 1000 ci
          chown -R ci:ci "$GITHUB_WORKSPACE"
      - name: Execute seeded boundary fuzzing
        run: runuser -u ci -- sh tests/fuzz/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fuzz-smoke-${{ github.sha }}
          path: artifacts/fuzz
          if-no-files-found: error
          retention-days: 14
  module-compile:
    runs-on: ubuntu-22.04
    container: debian:trixie
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: v4.12.1
            sha: 4785cd00553ac81cfbef7f0278803ebec42225f3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install compile dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git g++-14 make perl pkg-config libnode-dev libcurl4-openssl-dev libsqlite3-dev binutils python3
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: inspircd/inspircd
          ref: ${{ matrix.sha }}
          path: upstream
          persist-credentials: false
      - name: Compile actual module with matching V8
        env:
          CXX: g++-14
          INSPIRCD_SOURCE: ${{ github.workspace }}/upstream
          INSPIRCD_SHA: ${{ matrix.sha }}
        run: sh tests/ci/compile_module.sh
