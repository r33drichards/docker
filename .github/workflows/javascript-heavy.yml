name: JavaScript heavy checks
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
permissions:
  contents: read
concurrency:
  # Unrelated label edits must not cancel a requested heavy run.
  group: javascript-heavy-${{ ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci:heavy') && github.run_id || github.event.pull_request.number }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  requested:
    permissions:
      contents: read
      pull-requests: read
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled' || github.event.label.name == 'ci:heavy'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.authorize.outputs.enabled }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: authorize
        name: Verify label and its maintainer authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/ci/authorize_heavy.py
  fuzz-and-lifecycle:
    needs: requested
    if: needs.requested.outputs.enabled == 'true'
    runs-on: ubuntu-22.04
    container: debian:trixie
    timeout-minutes: 25
    env:
      CXX: clang++-19
      FUZZ_SECONDS: '120'
      FUZZ_OUT: artifacts/fuzz-heavy
      CI_NATIVE_LOG_DIR: artifacts/lifecycle
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install matched toolchain and V8
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang-19 libclang-rt-19-dev g++-14 libc6-dbg valgrind libnode-dev pkg-config python3
          mkdir -p artifacts/lifecycle
          dpkg-query -W > artifacts/lifecycle/packages.txt
          useradd --create-home --uid 1000 ci
          chown -R ci:ci "$GITHUB_WORKSPACE"
      - name: Valgrind V8 lifecycle and retained-memory checks
        env:
          CXX: g++-14
        run: runuser -u ci -- bash tests/ci/native.sh lifecycle
      - name: Extended seeded fuzzing
        run: runuser -u ci -- sh tests/fuzz/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: heavy-native-${{ github.sha }}
          path: artifacts
          if-no-files-found: error
          retention-days: 30
  docker-integration:
    needs: requested
    if: needs.requested.outputs.enabled == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        inspircd: [v4.12.1]
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build cached builder image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.javascript
          target: builder
          build-args: |
            VERSION=${{ matrix.inspircd }}
            TEST_HOOK_PROBE=1
          tags: javascript-builder
          load: true
          provenance: false
          cache-from: type=gha,scope=js-${{ matrix.inspircd }}
          cache-to: type=gha,mode=max,scope=js-${{ matrix.inspircd }}
      - name: Test runtime using Alpine V8
        run: |
          mkdir -p artifacts
          docker run --rm --user inspircd --entrypoint sh -v "$PWD:/repo:ro" javascript-builder -c 'cd /repo && sh tests/js_runtime.sh && sh tests/js_script_loader.sh' 2>&1 | tee artifacts/alpine-runtime.log
      - name: Build cached runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.javascript
          build-args: |
            VERSION=${{ matrix.inspircd }}
            TEST_HOOK_PROBE=1
          tags: javascript-testing
          load: true
          provenance: false
          cache-from: type=gha,scope=js-${{ matrix.inspircd }}
          cache-to: type=gha,mode=max,scope=js-${{ matrix.inspircd }}
      - name: Test actual daemon, authority, errors, Wasm, and module reload
        run: |
          docker run --rm --user root --entrypoint sh -v "$PWD:/repo:ro" javascript-testing -c 'apk add --no-cache python3 && su inspircd -s /bin/sh -c "INSPIRCD_NATIVE=/inspircd python3 /repo/tests/javascript_native.py"' 2>&1 | tee artifacts/daemon.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: docker-${{ matrix.inspircd }}-${{ github.sha }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14
