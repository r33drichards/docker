name: JavaScript documentation
on:
  pull_request:
    paths: ['site-docs/**', 'mkdocs.yml', 'requirements-docs.txt', 'JAVASCRIPT.md', 'bindings/**', 'modules/*.d.ts', 'modules/js_generated/**', 'tools/generate_docs_reference.py', '.github/workflows/docs.yml']
  push:
    branches: [master]
    paths: ['site-docs/**', 'mkdocs.yml', 'requirements-docs.txt', 'JAVASCRIPT.md', 'bindings/**', 'modules/*.d.ts', 'modules/js_generated/**', 'tools/generate_docs_reference.py', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build strict documentation
        run: |
          python3 -m venv .venv-docs
          .venv-docs/bin/pip install -r requirements-docs.txt
          python3 tools/generate_docs_reference.py --check
          .venv-docs/bin/mkdocs build --strict
  publish:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Publish reviewed documentation branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m venv .venv-docs
          .venv-docs/bin/pip install -r requirements-docs.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          .venv-docs/bin/mkdocs gh-deploy --strict --message 'Publish JavaScript documentation'
